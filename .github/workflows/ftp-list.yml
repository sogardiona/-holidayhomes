name: FTP cleanup (one-off)
on: workflow_dispatch
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$U","$P" -e "set ssl:verify-certificate no; rm -r public_html/; echo '--- root now'; cls -la; bye" "$S"
