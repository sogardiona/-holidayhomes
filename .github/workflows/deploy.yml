name: Deploy to test.holidayhomes.lu
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: test/   # the FTP account starts in public_html; test.holidayhomes.lu serves public_html/test
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
